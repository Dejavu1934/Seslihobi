<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Seslihobi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#efe9d6;background-image:radial-gradient(#ddd2b3 1px, transparent 1px);background-size:22px 22px;position:fixed;width:100%;height:100dvh;overflow:hidden;font-family:Arial;display:flex;justify-content:center}
.paper{position:fixed;top:8%;left:50%;transform:translateX(-50%);width:92%;max-width:365px;background:#fff;border:1px solid #bbb;box-shadow:0 12px 25px rgba(0,0,0,.2);border-radius:4px;z-index:1}
.hdr{display:flex;align-items:center;justify-content:center;margin:24px 18px 18px}.line{flex:1;height:1px;background:#bbb;margin:0 12px}.logo{font-weight:700;font-size:26px;color:#6e6e6e}
.box{margin:0 14px;border:2.5px solid #c21e1e;border-radius:8px;height:52px;display:flex;align-items:center;padding:0 10px;gap:8px;background:#fff}.box input{flex:1;border:0;outline:0;font-size:17px;background:transparent}
.ico{width:32px;height:32px;background:#e6e6e6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.gender{display:flex;justify-content:center;margin-top:14px}.gender button{padding:8px 0;width:88px;border:1px solid #999;background:#ddd;font-size:14px;cursor:pointer}.gender button:first-child{border-radius:6px 0 0 6px;border-right:0}.gender button:last-child{border-radius:0 6px 6px 0}.gender button.active{background:#5a3ce0!important;color:#fff!important;border-color:#5a3ce0!important;font-weight:700}
.btn{display:block;margin:12px auto 16px;background:#ffca2c;border:1px solid #b89600;border-radius:20px;padding:9px 32px;font-weight:800;font-size:15px;cursor:pointer}.foot{background:#eee;border-top:1px solid #ccc;display:flex;justify-content:space-around;padding:12px 0}.foot span{color:#777;font-size:13px}
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center}#popup.show{display:flex}
.pbox{background:#fff;border-radius:16px;padding:28px 32px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);min-width:300px;border:1px solid #ddd}
.loader-wrap{position:relative;width:72px;height:72px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.green-tick{width:52px;height:52px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:900;z-index:2}
.yellow-ring{position:absolute;top:0;left:0;width:72px;height:72px;border:5px solid transparent;border-top:5px solid #ffcc00;border-right:5px solid #ffcc00;border-radius:50%;animation:spinRing 0.8s linear infinite;z-index:1}
@keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#lobby{display:none;position:fixed;inset:0;background:#15151d;z-index:5;padding:14px;overflow:auto}#lobby.show{display:block}
.card{background:#1e1e2c;border:1px solid #2d2d40;border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;color:#fff}
.btn2{background:#7a5cff;color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
/* BEJ ODA İÇİ */
#room{display:none;position:fixed;inset:0;background:#efe9d6;z-index:10;flex-direction:column}#room.show{display:flex}
.topbar{background:#fff;border-bottom:1px solid #ccc;padding:8px}
.top1{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:#333}
.top2{display:flex;gap:6px;margin-top:8px;overflow:auto}
.mic{width:38px;height:38px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:1.5px solid #bbb}
.chat{flex:1;overflow:auto;padding:12px;background:#efe9d6;background-image:radial-gradient(#ddd2b3 1.2px, transparent 1.2px);background-size:22px 22px}
.bubble{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;max-width:80%;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.15);border:1px solid #e0d8c0}
.bubble.me{margin-left:auto;background:#fff8c5}
.bubble.sys{background:rgba(0,0,0,.07);text-align:center;margin:8px auto;padding:4px 12px;border-radius:12px;max-width:max-content;font-size:11px;border:0;box-shadow:none;color:#555}
.bottom{padding:8px;background:#fff;border-top:1px solid #ccc;display:flex;align-items:center;gap:8px}
.bottom input{flex:1;border:1px solid #bbb;border-radius:20px;padding:10px 14px;outline:0;background:#f9f6ec}
</style>
</head>
<body>
<div class="paper" id="loginPage"><div class="hdr"><div class="line"></div><div class="logo">Seslihobi</div><div class="line"></div></div><div class="box"><div class="ico">👤</div><input type="text" id="rumuz" placeholder="Rumuz..." maxlength="16"></div><div class="gender"><button type="button" id="btnErkek" class="active">Erkek</button><button type="button" id="btnKadin">Kadın</button></div><button type="button" class="btn" id="btnBaglan">Bağlan!</button><div class="foot"><span>Gizlilik</span><span>Kurallar</span><span>Türkçe</span></div></div>
<div id="popup"><div class="pbox"><div class="loader-wrap"><div class="yellow-ring"></div><div class="green-tick">✓</div></div><b style="font-size:18px">Giriş Başarılı</b><p style="font-size:14px;color:#666;margin-top:4px">Lütfen bekleyiniz...</p></div></div>

<div id="lobby"><div style="display:flex;justify-content:space-between;color:#fff;margin-bottom:14px"><div style="font-weight:900;font-size:18px">SESLİ<span style="color:#7a5cff">HOBİ</span> <span id="nickShow" style="font-size:11px;opacity:.6;margin-left:6px"></span></div><button class="btn2" style="background:#333" onclick="location.reload()">Çıkış</button></div><input id="odaAd" style="width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#1e1e2c;color:#fff;margin-bottom:10px" placeholder="Oda adı yaz"><button class="btn2" style="width:100%;padding:11px;background:#7a5cff" id="btnOda">+ Oda Kur</button><div id="liste"></div></div>

<div id="room"><div class="topbar"><div class="top1"><span style="display:flex;align-items:center;gap:8px"><span onclick="document.getElementById('room').classList.remove('show');document.getElementById('lobby').classList.add('show')" style="cursor:pointer"><</span> <span id="odaTitle">Kültür ve Edebiyat</span></span><span>👥 566 ⚙️</span></div><div class="top2"><div class="mic">🎤</div><div class="mic">🎤</div><div class="mic">🎤</div><div class="mic" style="border-color:#22c55e;background:#e8f5e9">🎤</div><div class="mic">🎤</div><div class="mic">🎤</div><div class="mic">🎤</div></div></div><div class="chat" id="chatBox"><div class="bubble sys">Bugün</div><div class="bubble sys">Girilen oda: <span id="sysOda">Genel Sohbet</span> 12:39</div><div class="bubble">Selam test <span style="font-size:10px;color:#888;float:right">12:39</span></div><div class="bubble me">Selamlar <span style="font-size:10px;color:#888;float:right">12:39</span></div></div><div class="bottom"><span style="font-size:22px">+</span><input id="msgInput" placeholder="Mesaj..."><span>😊</span><span>📻</span></div></div>

<script>
let gender="Erkek"; const bE=document.getElementById('btnErkek'); const bK=document.getElementById('btnKadin');
bE.addEventListener('click',()=>{gender="Erkek";bE.classList.add('active');bK.classList.remove('active');});
bK.addEventListener('click',()=>{gender="Kadın";bK.classList.add('active');bE.classList.remove('active');});
document.getElementById('btnBaglan').addEventListener('click',()=>{
let r=document.getElementById('rumuz').value.trim(); if(r.length<3){alert("Rumuz en az 3 harf");return;}
localStorage.setItem("sh_nick",r); localStorage.setItem("sh_gender",gender);
document.getElementById('popup').classList.add('show');
setTimeout(()=>{document.getElementById('popup').classList.remove('show'); document.getElementById('loginPage').style.display='none'; document.getElementById('lobby').classList.add('show'); document.getElementById('nickShow').innerText=r+" • "+gender; render();},2500);
});
let rooms=JSON.parse(localStorage.getItem("sh_rooms")||"[]");
function render(){let h=""; rooms.forEach(o=>{h+=`<div class="card"><b>${o}</b><button class="btn2" onclick="openRoom('${o}')">Katıl</button></div>`}); h+=`<div class="card"><div><b>Genel Sohbet</b></div><button class="btn2" onclick="openRoom('Genel Sohbet')">Katıl</button></div>`; document.getElementById('liste').innerHTML=h;}
function openRoom(name){document.getElementById('odaTitle').innerText=name; document.getElementById('sysOda').innerText=name; document.getElementById('lobby').classList.remove('show'); document.getElementById('room').classList.add('show');}
document.getElementById('btnOda').addEventListener('click',()=>{let n=document.getElementById('odaAd').value.trim(); if(!n) n="Oda "+Math.floor(Math.random()*90+10); if(!rooms.includes(n)){rooms.unshift(n); localStorage.setItem("sh_rooms",JSON.stringify(rooms));} render(); document.getElementById('odaAd').value=""; openRoom(n);});
document.getElementById('msgInput').addEventListener('keydown',(e)=>{if(e.key==='Enter'){let v=e.target.value.trim(); if(!v) return; let d=document.createElement('div'); d.className='bubble me'; d.innerHTML=v+' <span style="font-size:10px;color:#888;float:right">şimdi</span>'; document.getElementById('chatBox').appendChild(d); e.target.value=''; document.getElementById('chatBox').scrollTop=99999;}});
</script>
</body>
</html>
