<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Seslihobi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#efe9d6;background-image:radial-gradient(#ddd2b3 1px, transparent 1px);background-size:22px 22px;position:fixed;width:100%;height:100dvh;overflow:hidden;font-family:Arial}
.paper{position:fixed;top:8%;left:50%;transform:translateX(-50%);width:92%;max-width:365px;background:#fff;border:1px solid #bbb;box-shadow:0 12px 25px rgba(0,0,0,.2);border-radius:4px;z-index:1}
.hdr{display:flex;align-items:center;justify-content:center;margin:24px 18px 18px}.line{flex:1;height:1px;background:#bbb;margin:0 12px}.logo{font-weight:700;font-size:26px;color:#6e6e6e}
.box{margin:0 14px;border:2.5px solid #c21e1e;border-radius:8px;height:52px;display:flex;align-items:center;padding:0 10px;gap:8px;background:#fff}.box input{flex:1;border:0;outline:0;font-size:17px;background:transparent}
.ico{width:32px;height:32px;background:#e6e6e6;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gender{display:flex;justify-content:center;margin-top:14px}.gender button{padding:8px 0;width:88px;border:1px solid #999;background:#ddd;font-size:14px;cursor:pointer}.gender button:first-child{border-radius:6px 0 0 6px;border-right:0}.gender button:last-child{border-radius:0 6px 6px 0}.gender button.active{background:#5a3ce0!important;color:#fff!important;border-color:#5a3ce0!important;font-weight:700}
.btn{display:block;margin:12px auto 16px;background:#ffca2c;border:1px solid #b89600;border-radius:20px;padding:9px 32px;font-weight:800;font-size:15px;cursor:pointer}.foot{background:#eee;border-top:1px solid #ccc;display:flex;justify-content:space-around;padding:12px 0}.foot span{color:#777;font-size:13px}
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center}#popup.show{display:flex}
.pbox{background:#fff;border-radius:16px;padding:28px 32px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);min-width:300px}
.loader-wrap{position:relative;width:72px;height:72px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.green-tick{width:52px;height:52px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:900;z-index:2}
.yellow-ring{position:absolute;top:0;left:0;width:72px;height:72px;border:5px solid transparent;border-top:5px solid #ffcc00;border-right:5px solid #ffcc00;border-radius:50%;animation:spinRing 0.8s linear infinite}
@keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#lobby{display:none;position:fixed;inset:0;background:#15151d;z-index:5;padding:14px;overflow:auto}#lobby.show{display:block}
.card{background:#1e1e2c;border:1px solid #2d2d40;border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;color:#fff}.btn2{background:#7a5cff;color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}

/* ODA İÇİ - FOTO BİREBİR BEJ + SABİT KLAVYE */
#room{display:none;position:fixed;inset:0;background:#f6f1e4;z-index:10;flex-direction:column}#room.show{display:flex}
/* ÜST BAR */
.topbar{background:#fff;border-bottom:2px solid #0ea5e9;padding:0}
.top1{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
.top1-left{color:#0ea5e9;font-weight:700;font-size:14px}
.top1-right{display:flex;align-items:center;gap:14px;font-size:13px;color:#555}
.badge{position:absolute;top:-6px;right:-6px;background:#0ea5e9;color:#fff;font-size:9px;padding:2px 5px;border-radius:10px}
.badge.red{background:#ef4444}
.icon-wrap{position:relative}
/* MİKROFON ŞERİDİ - KAPORA ROOT YERİNE MİKROFONLAR */
.mic-strip{background:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #ddd;overflow:auto;white-space:nowrap}
.mic-slot{min-width:64px;height:64px;background:#f3f3f3;border:2px dashed #bbb;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0}
.mic-slot.on{background:#fff;border-style:solid;border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.mic-slot .m{font-size:22px}
.mic-slot .n{font-size:9px;margin-top:2px;color:#555}
/* SAĞ SOL MENÜLER - RESİMDEKİ MAVİ OKLAR */
.side-btn{position:absolute;top:42%;width:36px;height:44px;background:#5aa9e6;border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;z-index:15;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.side-btn.right{right:0;border-radius:10px 0 0 10px;left:auto}
.side-btn .count{position:absolute;top:-8px;right:-4px;background:#0ea5e9;color:#fff;font-size:10px;padding:2px 5px;border-radius:10px;border:2px solid #fff}
/* CHAT ALANI BEJ + YAZILAR YOK BOŞ */
.chat{flex:1;overflow-y:auto;padding:12px;background:#f6f1e4;background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='20' font-size='10' opacity='0.04'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E");background-size:120px 120px;position:relative}
.empty-text{color:#aaa;font-size:13px;text-align:center;margin-top:40%;opacity:.6}
/* ALT MESAJ BAR - KLAVYEDE SABİT KALAN */
.bottom-wrap{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:6px 8px;display:flex;align-items:center;gap:8px;z-index:20}
.bottom-wrap input{flex:1;border:1px solid #ccc;border-radius:20px;padding:10px 14px;outline:0;font-size:14px;background:#f9f9f9}
.bottom-wrap .ibtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#666}
</style>
</head>
<body>
<div class="paper" id="loginPage"><div class="hdr"><div class="line"></div><div class="logo">Seslihobi</div><div class="line"></div></div><div class="box"><div class="ico">👤</div><input type="text" id="rumuz" placeholder="Rumuz..." maxlength="16"></div><div class="gender"><button type="button" id="btnErkek" class="active">Erkek</button><button type="button" id="btnKadin">Kadın</button></div><button type="button" class="btn" id="btnBaglan">Bağlan!</button><div class="foot"><span>Gizlilik</span><span>Kurallar</span><span>Türkçe</span></div></div>
<div id="popup"><div class="pbox"><div class="loader-wrap"><div class="yellow-ring"></div><div class="green-tick">✓</div></div><b style="font-size:18px">Giriş Başarılı</b><p style="font-size:13px;color:#666;margin-top:4px">Lütfen bekleyiniz...</p></div></div>

<div id="lobby"><div style="display:flex;justify-content:space-between;color:#fff;margin-bottom:14px"><div style="font-weight:900">SESLİ<span style="color:#7a5cff">HOBİ</span> <span id="nickShow" style="font-size:11px;opacity:.6;margin-left:6px"></span></div><button class="btn2" style="background:#333" onclick="location.reload()">Çıkış</button></div><input id="odaAd" style="width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#1e1e2c;color:#fff;margin-bottom:10px" placeholder="Oda adı yaz"><button class="btn2" style="width:100%;padding:11px" id="btnOda">+ Oda Kur</button><div id="liste"></div></div>

<div id="room">
<div class="topbar">
<div class="top1"><div class="top1-left" id="odaTitle">Kültür ve Edebiyat</div><div class="top1-right"><span style="display:flex;flex-direction:column;align-items:center"><span>👥</span><span style="font-size:10px">567</span></span><span class="icon-wrap">💬<span class="badge">1</span></span><span class="icon-wrap">📞<span class="badge red">2</span></span><span>⚙️</span></div></div>
<div class="mic-strip" id="micStrip">
<div class="mic-slot on"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎤</span><span class="n">Boş</span></div>
<div class="mic-slot"><span class="m">🎙️</span><span class="n" style="color:#0ea5e9">99:30</span></div>
</div>
</div>

<div class="chat" id="chatBox">
<div class="empty-text">Sohbet boş, ilk mesajı sen yaz</div>
<div class="side-btn left" onclick="alert('Katılımcılar')">↩<span class="count" style="display:none"></span></div>
<div class="side-btn right" onclick="alert('İstekler')">↪<span class="count">10</span></div>
</div>

<div class="bottom-wrap">
<div class="ibtn">+</div>
<input type="text" id="msgInput" placeholder="Mesaj...">
<div class="ibtn">😊</div>
<div class="ibtn">✋</div>
<div class="ibtn">📻</div>
<div class="ibtn" id="upBtn">^</div>
</div>
</div>

<script>
let gender="Erkek"; const bE=document.getElementById('btnErkek'); const bK=document.getElementById('btnKadin');
bE.addEventListener('click',()=>{gender="Erkek";bE.classList.add('active');bK.classList.remove('active');});
bK.addEventListener('click',()=>{gender="Kadın";bK.classList.add('active');bE.classList.remove('active');});
document.getElementById('btnBaglan').addEventListener('click',()=>{
let r=document.getElementById('rumuz').value.trim(); if(r.length<3){alert("Rumuz en az 3 harf");return;}
localStorage.setItem("sh_nick",r);
document.getElementById('popup').classList.add('show');
setTimeout(()=>{document.getElementById('popup').classList.remove('show'); document.getElementById('loginPage').style.display='none'; document.getElementById('lobby').classList.add('show'); document.getElementById('nickShow').innerText=r+" • "+gender; render();},2500);
});
let rooms=JSON.parse(localStorage.getItem("sh_rooms")||"[]");
function render(){let h=""; rooms.forEach(o=>{h+=`<div class="card"><b>${o}</b><button class="btn2" onclick="openRoom('${o}')">Katıl</button></div>`}); h+=`<div class="card"><b>Genel Sohbet</b><button class="btn2" onclick="openRoom('Genel Sohbet')">Katıl</button></div><div class="card"><b>Kültür ve Edebiyat</b><button class="btn2" onclick="openRoom('Kültür ve Edebiyat')">Katıl</button></div>`; document.getElementById('liste').innerHTML=h;}
function openRoom(name){document.getElementById('odaTitle').innerText=name; document.getElementById('lobby').classList.remove('show'); document.getElementById('room').classList.add('show');}
// KLAVYE SABİT KALMA - visualViewport
const roomEl=document.getElementById('room'); const chatBox=document.getElementById('chatBox'); const msgInput=document.getElementById('msgInput');
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{roomEl.style.height=window.visualViewport.height+'px'; setTimeout(()=>{chatBox.scrollTop=chatBox.scrollHeight;},100);});}
msgInput.addEventListener('focus',()=>{setTimeout(()=>{chatBox.scrollTop=chatBox.scrollHeight; roomEl.scrollTop=0;},300);});
msgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter'){let v=e.target.value.trim(); if(!v) return; if(document.querySelector('.empty-text')) document.querySelector('.empty-text').remove(); let d=document.createElement('div'); d.style.cssText='background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0 8px auto;max-width:75%;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.15);border:1px solid #e0d8c0;'; d.innerText=v; chatBox.appendChild(d); e.target.value=''; chatBox.scrollTop=chatBox.scrollHeight;}});
document.getElementById('btnOda').addEventListener('click',()=>{let n=document.getElementById('odaAd').value.trim(); if(!n) n="Oda "+Math.floor(Math.random()*90+10); if(!rooms.includes(n)){rooms.unshift(n); localStorage.setItem("sh_rooms",JSON.stringify(rooms));} render(); document.getElementById('odaAd').value=""; openRoom(n);});
// Mikrofona tıklayınca al
document.querySelectorAll('.mic-slot').forEach(s=>{s.addEventListener('click',()=>{document.querySelectorAll('.mic-slot').forEach(x=>x.classList.remove('on')); s.classList.add('on');});});
</script>
</body>
</html>
