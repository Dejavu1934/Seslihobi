<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Seslihobi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{position:fixed;inset:0;background:#efe9d6;font-family:Arial;overflow:hidden;height:100dvh}
.paper{position:fixed;top:8%;left:50%;transform:translateX(-50%);width:92%;max-width:365px;background:#fff;border:1px solid #bbb;box-shadow:0 12px 25px rgba(0,0,0,.2);border-radius:4px;z-index:1}
.hdr{display:flex;align-items:center;justify-content:center;margin:24px 18px 18px}.line{flex:1;height:1px;background:#bbb;margin:0 12px}.logo{font-weight:700;font-size:26px;color:#6e6e6e}
.box{margin:0 14px;border:2.5px solid #c21e1e;border-radius:8px;height:52px;display:flex;align-items:center;padding:0 10px;gap:8px;background:#fff}.box input{flex:1;border:0;outline:0;font-size:17px;background:transparent}
.ico{width:32px;height:32px;background:#e6e6e6;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gender{display:flex;justify-content:center;margin-top:14px}.gender button{padding:8px 0;width:88px;border:1px solid #999;background:#ddd;font-size:14px;cursor:pointer}.gender button:first-child{border-radius:6px 0 0 6px;border-right:0}.gender button:last-child{border-radius:0 6px 6px 0}.gender button.active{background:#5a3ce0!important;color:#fff!important;border-color:#5a3ce0!important;font-weight:700}
.btn{display:block;margin:12px auto 16px;background:#ffca2c;border:1px solid #b89600;border-radius:20px;padding:9px 32px;font-weight:800;font-size:15px;cursor:pointer}.foot{background:#eee;border-top:1px solid #ccc;display:flex;justify-content:space-around;padding:12px 0}.foot span{color:#777;font-size:13px}
#popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center}#popup.show{display:flex}
.pbox{background:#fff;border-radius:16px;padding:28px 32px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);min-width:300px}
.loader-wrap{position:relative;width:72px;height:72px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.green-tick{width:52px;height:52px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:900;z-index:2}
.yellow-ring{position:absolute;top:0;left:0;width:72px;height:72px;border:5px solid transparent;border-top:5px solid #ffcc00;border-right:5px solid #ffcc00;border-radius:50%;animation:spinRing .8s linear infinite}
@keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#lobby{display:none;position:fixed;inset:0;background:#15151d;z-index:5;padding:14px;overflow:auto}#lobby.show{display:block}
.card{background:#1e1e2c;border:1px solid #2d2d40;border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;color:#fff}.btn2{background:#7a5cff;color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}

/* === ODA İÇİ - FOTODAKİ GİBİ === */
#room{display:none;position:fixed;inset:0;z-index:10;flex-direction:column;background:#f2ecd9}#room.show{display:flex}
/* ÜST BAR */
.top{height:44px;background:#fff;border-bottom:2px solid #2196F3;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.top b{color:#2196F3;font-size:15px;font-weight:700}
.top-icons{display:flex;align-items:center;gap:16px}
.top-icons div{position:relative;font-size:18px;color:#666}
.top-icons span.cnt{position:absolute;top:-8px;right:-8px;background:#2196F3;color:#fff;font-size:9px;padding:2px 5px;border-radius:10px;font-weight:700}
.top-icons span.cnt.red{background:#f44336}
.sub{font-size:11px;color:#666;margin-top:-2px;text-align:center}
/* MİKROFON ŞERİDİ - KAPORA ROOT YERİNE */
.mics{height:68px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:10px;padding:0 10px;overflow-x:auto}
.m{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:#f0f0f0;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.m.on{border-color:#4caf50;background:#e8f5e9;box-shadow:0 0 0 3px rgba(76,175,80,.15)}
.m.dashed{border-style:dashed}
.timer{margin-left:auto;min-width:76px;height:52px;background:#e3f2fd;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #90caf9;flex-shrink:0}
.timer b{font-size:12px;color:#2196F3}
.timer i{font-style:normal;font-size:16px;color:#2196F3}
/* ORTA CHAT - BEJ DESENLİ BOŞ */
.chat{flex:1;overflow-y:auto;background:#f6f1e4;background-image:radial-gradient(#e8dcc0 1px, transparent 1px);background-size:20px 20px;padding:60px 12px 12px;position:relative}
.bubble{max-width:78%;background:#fff;border-radius:16px;padding:10px 12px;margin:6px 0;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.bubble.me{margin-left:auto;background:#dcf8c6}
.bubble.sys{margin:6px auto;background:rgba(255,255,255,.9);font-size:11px;color:#666;text-align:center;max-width:max-content;padding:5px 12px;border-radius:12px}
/* SAĞ SOL MAVİ BUTONLAR - RESİMDEKİ GİBİ */
.side{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:48px;background:#5aa9e6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.side.left{left:0;border-radius:0 12px 12px 0}
.side.right{right:0;border-radius:12px 0 0 12px}
.side .badge10{position:absolute;top:-8px;right:-6px;background:#2196F3;color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:10px;border:2px solid #fff}
/* ALT BAR - KLAVYEDE SABİT */
.bottom{height:56px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;gap:8px;padding:0 8px;flex-shrink:0;position:relative;z-index:30}
.bottom input{flex:1;height:38px;border:1px solid #ddd;border-radius:20px;padding:0 14px;outline:0;background:#f9f9f9;font-size:14px}
.ibtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#666;cursor:pointer}
</style>
</head>
<body>
<div class="paper" id="loginPage"><div class="hdr"><div class="line"></div><div class="logo">Seslihobi</div><div class="line"></div></div><div class="box"><div class="ico">👤</div><input id="rumuz" placeholder="Rumuz..." maxlength="16"></div><div class="gender"><button id="btnErkek" class="active">Erkek</button><button id="btnKadin">Kadın</button></div><button class="btn" id="btnBaglan">Bağlan!</button><div class="foot"><span>Gizlilik</span><span>Kurallar</span><span>Türkçe</span></div></div>
<div id="popup"><div class="pbox"><div class="loader-wrap"><div class="yellow-ring"></div><div class="green-tick">✓</div></div><b>Giriş Başarılı</b><p style="font-size:13px;color:#666;margin-top:4px">Lütfen bekleyiniz...</p></div></div>

<div id="lobby"><div style="display:flex;justify-content:space-between;color:#fff;margin-bottom:12px"><div style="font-weight:900">SESLİ<span style="color:#7a5cff">HOBİ</span> <span id="nickShow" style="font-size:11px;opacity:.6;margin-left:6px"></span></div><button class="btn2" style="background:#333" onclick="location.reload()">Çıkış</button></div><input id="odaAd" style="width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#1e1e2c;color:#fff;margin-bottom:10px" placeholder="Oda adı yaz"><button class="btn2" style="width:100%;padding:11px" id="btnOda">+ Oda Kur</button><div id="liste"></div></div>

<div id="room">
<div class="top"><b>Kültür ve Edebiyat</b><div class="top-icons"><div>👥<div class="sub" id="uCount">567</div></div><div>💬<span class="cnt">1</span></div><div>📞<span class="cnt red">2</span></div><div>⚙️</div></div></div>
<div class="mics" id="micsBar">
<div class="m on">🎤</div><div class="m">🎤</div><div class="m">🎤</div><div class="m">🎤</div><div class="m">🎤</div><div class="m">🎤</div><div class="m dashed">🎤</div>
<div class="timer"><b>99:30</b><i>〰️</i></div>
</div>

<div style="flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden">
<div class="side left">↗️</div>
<div class="side right">↙️<span class="badge10">10</span></div>
<div class="chat" id="chatBox">
<!-- İÇERİK BOŞ - SENİN İSTEDİĞİN GİBİ YAZI YOK -->
<div class="bubble sys">Bugün</div>
</div>
</div>

<div class="bottom"><div class="ibtn">+</div><input id="msgInput" placeholder="Mesaj..."><div class="ibtn">😊</div><div class="ibtn">✋</div><div class="ibtn">📻</div><div class="ibtn">︿</div></div>
</div>

<script>
let gender="Erkek"; const bE=document.getElementById('btnErkek'), bK=document.getElementById('btnKadin');
bE.onclick=()=>{gender="Erkek";bE.classList.add('active');bK.classList.remove('active')};
bK.onclick=()=>{gender="Kadın";bK.classList.add('active');bE.classList.remove('active')};
document.getElementById('btnBaglan').onclick=()=>{
let r=document.getElementById('rumuz').value.trim(); if(r.length<3){alert("Rumuz 3 harf");return;}
localStorage.setItem("sh_nick",r);
document.getElementById('popup').classList.add('show');
setTimeout(()=>{document.getElementById('popup').classList.remove('show');document.getElementById('loginPage').style.display='none';document.getElementById('lobby').classList.add('show');document.getElementById('nickShow').innerText=r;render();},2500);
};
let rooms=JSON.parse(localStorage.getItem("sh_rooms")||"[]");
function render(){let h="";rooms.forEach(o=>{h+=`<div class="card"><b>${o}</b><button class="btn2" onclick="openRoom('${o}')">Katıl</button></div>`});h+=`<div class="card"><b>Genel Sohbet</b><button class="btn2" onclick="openRoom('Genel Sohbet')">Katıl</button></div>`;document.getElementById('liste').innerHTML=h;}
function openRoom(name){document.querySelector('.top b').innerText=name;document.getElementById('lobby').classList.remove('show');document.getElementById('room').classList.add('show');}
document.getElementById('btnOda').onclick=()=>{let n=document.getElementById('odaAd').value.trim(); if(!n) n="Oda "+(Math.floor(Math.random()*90)+10); rooms.unshift(n); localStorage.setItem("sh_rooms",JSON.stringify(rooms)); render(); document.getElementById('odaAd').value=""; openRoom(n);};
// KLAVYEDE SABİT KALMA - iOS/Android
const chat=document.getElementById('chatBox'), input=document.getElementById('msgInput');
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{document.body.style.height=visualViewport.height+'px'; chat.scrollTop=chat.scrollHeight;});}
input.addEventListener('focus',()=>{setTimeout(()=>{chat.scrollTop=chat.scrollHeight;},300)});
input.addEventListener('keydown',(e)=>{if(e.key==='Enter'){let v=e.target.value.trim(); if(!v) return; let d=document.createElement('div'); d.className='bubble me'; d.innerText=v; chat.appendChild(d); e.target.value=''; chat.scrollTop=99999;}});
// Mikrofon tıklama
document.querySelectorAll('.m').forEach(el=>{el.onclick=()=>{document.querySelectorAll('.m').forEach(x=>x.classList.remove('on')); el.classList.add('on'); let sys=document.createElement('div'); sys.className='bubble sys'; sys.innerText='Mikrofon aldınız'; chat.appendChild(sys); chat.scrollTop=99999;}});
</script>
</body>
</html>
